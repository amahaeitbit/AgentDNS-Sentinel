<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">AgentDNS Sentinel DNS enforcement path</title>
  <desc id="desc">An AI agent DNS query passes through identity, deny and query guards, an allowlist, quota and budget controls, and health-aware balancing before reaching a service. Every decision creates evidence inside a Runloop network boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="audit-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}.label{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a;text-anchor:middle}.small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b;text-anchor:middle}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14;filter:url(#shadow)}.control{fill:#eff6ff;stroke:#60a5fa}.success{fill:#ecfdf5;stroke:#34d399}.evidence{fill:#fff7ed;stroke:#fb923c}.arrow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrow)}.audit{fill:none;stroke:#d97706;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#audit-arrow)}
    </style>
  </defs>
  <rect width="1440" height="430" fill="#f8fafc"/>
  <rect x="24" y="22" width="1392" height="386" rx="24" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="52" y="58" class="title">DNS enforcement path</text>
  <text x="52" y="83" class="sub">Runloop deny-by-default network policy forms the outer egress boundary</text>

  <path class="arrow" d="M218 157 H274"/><path class="arrow" d="M454 157 H510"/><path class="arrow" d="M690 157 H746"/><path class="arrow" d="M926 157 H982"/>
  <path class="arrow" d="M1072 201 V247"/><path class="arrow" d="M982 291 H926"/><path class="arrow" d="M746 291 H690"/><path class="arrow" d="M510 291 H454"/>
  <path class="audit" d="M364 201 V250"/><path class="audit" d="M836 201 C836 350 690 365 454 333"/>

  <g><rect class="box" x="38" y="113" width="180" height="88"/><text class="label" x="128" y="150">AI agent</text><text class="small" x="128" y="174">workload identity</text></g>
  <g><rect class="box control" x="274" y="113" width="180" height="88"/><text class="label" x="364" y="150">AgentDNS</text><text class="small" x="364" y="174">policy resolver</text></g>
  <g><rect class="box control" x="510" y="113" width="180" height="88"/><text class="label" x="600" y="150">Identity</text><text class="small" x="600" y="174">source → agent</text></g>
  <g><rect class="box control" x="746" y="113" width="180" height="88"/><text class="label" x="836" y="150">Deny + guard</text><text class="small" x="836" y="174">block threats first</text></g>
  <g><rect class="box control" x="982" y="113" width="180" height="88"/><text class="label" x="1072" y="150">Allowlist</text><text class="small" x="1072" y="174">may it resolve?</text></g>
  <g><rect class="box control" x="982" y="247" width="180" height="88"/><text class="label" x="1072" y="284">Quota + budget</text><text class="small" x="1072" y="308">limit rate and cost</text></g>
  <g><rect class="box control" x="746" y="247" width="180" height="88"/><text class="label" x="836" y="284">Health + balance</text><text class="small" x="836" y="308">healthy replicas only</text></g>
  <g><rect class="box success" x="510" y="247" width="180" height="88"/><text class="label" x="600" y="284">Service</text><text class="small" x="600" y="308">allowed endpoint</text></g>
  <g><rect class="box evidence" x="274" y="247" width="180" height="88"/><text class="label" x="364" y="284">Evidence</text><text class="small" x="364" y="308">decision + reason</text></g>
  <text x="1192" y="151" class="sub">BLOCK</text><path class="audit" d="M1162 157 H1290 V291 H1162"/>
</svg>
