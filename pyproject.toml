[project]
name = "agentdns-sentinel"
version = "0.1.0"
description = "AgentDNS Sentinel: sandboxed traffic governance and observability for AI agents"
requires-python = ">=3.11"
dependencies = [
  "dnslib>=0.9.26,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "reflex>=0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
docs = ["matplotlib>=3.8"]
runloop = ["runloop-api-client>=1.31,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
